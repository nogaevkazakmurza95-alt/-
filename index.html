<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гипс Хас Г.Н. — Катало изделий ручной работы</title>
    <style>
        :root {
            --primary-color: #4a235a;
            --accent-color: #8e44ad;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --danger-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .admin-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Админ-панель */
        .admin-panel {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 3rem;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-panel h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--primary-color);
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            color: var(--primary-color);
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent-color);
            margin: 0.5rem auto 0;
            border-radius: 2px;
        }

        /* Сетка каталога */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .card-img-wrapper {
            position: relative;
            padding-top: 100%;
            background-color: #f8f9fa;
        }

        .card-img-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .no-photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a4b0be;
            font-size: 0.9rem;
            text-align: center;
            padding: 1rem;
            background: #eee;
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent-color);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s ease;
            border: none;
            margin-top: auto;
        }

        .btn:hover {
            background-color: var(--primary-color);
        }

        .delete-btn {
            background-color: var(--danger-color);
            margin-top: 0.5rem;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }

        footer {
            background-color: #1a1a1a;
            color: #ccc;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Гипс Хас Г.Н.</h1>
        <p>Изделия и копилки из гипса ручной работы</p>
        <button class="admin-toggle-btn" onclick="toggleAdmin()">⚙️ Админ-панель</button>
    </header>

    <main class="container">

        <!-- АДМИН-ПАНЕЛЬ -->
        <div id="adminPanel" class="admin-panel">
            <h2>Добавить новый товар</h2>
            <form id="addProductForm" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label for="productTitle">Название товара:</label>
                    <input type="text" id="productTitle" required placeholder="Например: Копилка медведь">
                </div>
                <div class="form-group">
                    <label for="productImage">Имя файла фото (например: foto1.jpg):</label>
                    <input type="text" id="productImage" required placeholder="IMG_1900.jpeg">
                </div>
                <button type="submit" class="btn-primary">Опубликовать товар</button>
            </form>
        </div>

        <h2 class="section-title">Каталог изделий</h2>

        <!-- СЕТКА ТОВАРОВ -->
        <div class="grid" id="catalog-grid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Гипс Хас Г.Н.</p>
    </footer>

    <script>
        // Четкий базовый список из 18 товаров с правильными именами файлов и названий
        let defaultProducts = [
            { id: 1, title: "Копилка кролик черно-белый", image: "IMG_1819.jpeg" },
            { id: 2, title: "Копилка кролик коричневый", image: "IMG_1818.jpeg" },
            { id: 3, title: "Копилка волк серо-белый", image: "IMG_1817.jpeg" },
            { id: 4, title: "Копилка лиса красно-белая", image: "IMG_1815.jpeg" },
            { id: 5, title: "Копилка кот серый с поднятой лапой", image: "IMG_1814.png" },
            { id: 6, title: "Копилка сундук желтый с черным", image: "IMG_1813.jpeg" },
            { id: 7, title: "Копилка сундук белый с коричневым", image: "IMG_1812.png" },
            { id: 8, title: "Копилка бочонок черно-белый с полумесяцем и звездой", image: "IMG_1810.png" },
            { id: 9, title: "Копилка бочонок бело-коричневый с полумесяцем и звездой", image: "IMG_1811.png" },
            { id: 10, title: "Копилка бочонок со звездой", image: "IMG_1807.png" },
            { id: 11, title: "Копилка «Медвежонок»", image: "IMG_1801.png" },
            { id: 12, title: "Копилка «Медвежонок»", image: "IMG_1805.png" },
            { id: 13, title: "Копилка «Сундучок»", image: "IMG_1803.jpeg" },
            { id: 14, title: "Копилка «Мешочек»", image: "IMG_1820.png" },
            { id: 15, title: "Кашпо «Бочка»", image: "IMG_1806.png" },
            { id: 16, title: "Кашпо «Бочка»", image: "IMG_1816.jpeg" },
            { id: 17, title: "Копилка «Мешочек»", image: "IMG_1821.png" },
            { id: 18, title: "Копилка «Сундучок»", image: "IMG_1822.png" }
        ];

        let products = JSON.parse(localStorage.getItem('gips_products')) || defaultProducts;

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
            renderCatalog();
        }

        function addProduct(event) {
            event.preventDefault();
            const title = document.getElementById('productTitle').value;
            const image = document.getElementById('productImage').value;

            const newProduct = {
                id: Date.now(),
                title: title,
                image: image
            };

            products.unshift(newProduct);
            saveAndRender();

            document.getElementById('productTitle').value = '';
            document.getElementById('productImage').value = '';
            alert('Товар успешно добавлен!');
        }

        function deleteProduct(id) {
            if (confirm('Удалить этот товар из каталога?')) {
                products = products.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('gips_products', JSON.stringify(products));
            renderCatalog();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            const isAdminActive = document.getElementById('adminPanel').classList.contains('active');

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';

                const waText = encodeURIComponent(`Здравствуйте! Хочу заказать ${product.title}`);
                const waLink = `https://wa.me/789285260401?text=${waText}`;

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${product.image}" alt="${product.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="no-photo" style="display:none;">Фото загружается...</div>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${product.title}</h3>
                        <a href="${waLink}" class="btn" target="_blank">Заказать</a>
                        ${isAdminActive ? `<button class="btn delete-btn" onclick="deleteProduct(${product.id})">Удалить товар</button>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        renderCatalog();
    </script>
</body>
</html>
